kind: wasmer.io/App.v0
owner: maqyot
name: sim-manager
package: .
env:
  LOG_CHANNEL: stderr
  LOG_LEVEL: error
jobs:
  - name: migrate-laravel
    trigger: post-deployment
    timeout: 5m
    action:
      execute:
        package: .
        command: php
        cli_args:
          - artisan
          - migrate
          - --force
